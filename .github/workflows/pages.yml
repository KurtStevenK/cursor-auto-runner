name: Deploy landing page

# Publishes landing/ to GitHub Pages at
# https://kurtstevenk.github.io/cursor-auto-runner/
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [master]
    paths: ['landing/**']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
