name: Build releases

# Builds all platform packages on the OSes that support them:
#  - Windows installer (NSIS, x64 + arm64) + Chocolatey package
#  - Linux AppImage + deb + pacman (requires a real Linux toolchain — not possible on Windows)
#  - macOS DMG universal (requires macOS — hdiutil)
# On tagged releases it also:
#  - creates the GitHub Release with changelog-based notes
#  - publishes the Chocolatey package to community.chocolatey.org (secret: CHOCOLATEY_API_KEY)
#  - updates the cursor-auto-runner cask in KurtStevenK/homebrew-tap (secret: TAP_TOKEN)
#  - publishes the .deb to KurtStevenK/apt on gh-pages (secrets: TAP_TOKEN, APT_GPG_PRIVATE_KEY)
#  - optionally scans release installers on VirusTotal (secret: VIRUSTOTAL_API_KEY)
#  - publishes Linux AppImage, .deb, and .pacman to Firebase Storage linux/<version>/ (no GitHub 100 MB limit)
#  - mirrors Windows and macOS installers to Firebase Storage releases/<version>/
# Trigger: push a tag like v1.2.11, or run manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder install-app-deps
      - run: npm run test:stats
      - run: npm run bench:matcher

  windows:
    needs: quality
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
      - run: npm run test:packaged-worker
      - name: Build Chocolatey package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXE="release/Cursor Auto Runner Setup ${VERSION}.exe"
          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          PKG=choco-pkg
          mkdir -p "$PKG/tools"
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__EXESHA__/$SHA/g" packaging/chocolatey/cursor-auto-runner.nuspec > "$PKG/cursor-auto-runner.nuspec"
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__EXESHA__/$SHA/g" packaging/chocolatey/tools/chocolateyinstall.ps1 > "$PKG/tools/chocolateyinstall.ps1"
          (cd "$PKG" && choco pack)
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            choco-pkg/*.nupkg

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman

  macos:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Require Apple signing secrets on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CSC_LINK:-}" ]] && missing+=(CSC_LINK)
          [[ -z "${CSC_KEY_PASSWORD:-}" ]] && missing+=(CSC_KEY_PASSWORD)
          [[ -z "${APPLE_TEAM_ID:-}" ]] && missing+=(APPLE_TEAM_ID)
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub Actions secrets for signed macOS releases: ${missing[*]}. See packaging/mac/README.md and scripts/push-apple-signing-to-github.sh"
            exit 1
          fi
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            echo "::warning::APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD not set — macOS builds will be Developer ID signed but not notarized."
          fi
      - name: Import Developer ID certificate (keychain)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Build signed macOS DMGs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v//$'\r'/}"
            v="${v//$'\n'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          APPLE_ID="$(trim "${APPLE_ID:-}")"
          APPLE_APP_SPECIFIC_PASSWORD="$(trim "${APPLE_APP_SPECIFIC_PASSWORD:-}")"
          APPLE_TEAM_ID="$(trim "${APPLE_TEAM_ID:-}")"
          export APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          email=no
          [[ "$APPLE_ID" == *@* ]] && email=yes
          echo "APPLE_ID length ${#APPLE_ID} email=${email}"
          echo "APPLE_APP_SPECIFIC_PASSWORD length ${#APPLE_APP_SPECIFIC_PASSWORD} (expect 16 or 19)"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          if [[ ${#APPLE_APP_SPECIFIC_PASSWORD} -ne 16 && ${#APPLE_APP_SPECIFIC_PASSWORD} -ne 19 ]]; then
            echo "::warning::App-specific password length is ${#APPLE_APP_SPECIFIC_PASSWORD}; expected 16 or 19"
          fi
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" >/dev/null
          # Cert is already in KEYCHAIN_PATH — do not set CSC_LINK or electron-builder imports the
          # .p12 into a second temp keychain and set-key-partition-list fails on CI.
          security find-identity -v -p codesigning
          npm run dist:mac
      - name: Verify macOS code signature (when CSC_LINK is set)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "::warning::CSC_LINK not set — DMGs are ad-hoc signed; Gatekeeper may block Homebrew installs."
            exit 0
          fi
          for APP in "release/mac-arm64/Cursor Auto Runner.app" "release/mac/Cursor Auto Runner.app"; do
            [[ -d "$APP" ]] || continue
            codesign --verify --deep --strict --verbose=2 "$APP"
            xcrun stapler validate "$APP"
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
              spctl -a -t exec -vv "$APP"
            else
              echo "::notice::Skipping spctl (notarization secrets not set)"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Linux packages to Firebase Storage
        env:
          FIREBASE_SERVICE_ACCOUNT_LINUX: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINUX }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_LINUX:-}" || -z "${FIREBASE_STORAGE_BUCKET:-}" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_LINUX and FIREBASE_STORAGE_BUCKET are required. Linux packages are published to Firebase Storage, not GitHub Releases." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$FIREBASE_SERVICE_ACCOUNT_LINUX" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          chmod +x scripts/upload-linux-firebase.sh scripts/mirror-release-firebase.sh
          bash scripts/upload-linux-firebase.sh "$VERSION" artifacts/linux
          bash scripts/mirror-release-firebase.sh "$VERSION" artifacts

      - name: VirusTotal scan release artifacts
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VIRUSTOTAL_API_KEY:-}" ]]; then
            echo "::notice::VIRUSTOTAL_API_KEY not set — skipping VirusTotal"
            exit 0
          fi
          node scripts/virustotal-scan.js --artifacts-dir artifacts --report virustotal-report.md

      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v ver="$VERSION" 'BEGIN{insec=0} /^## \[/{ if (insec) exit; if (index($0, "## [" ver) == 1) insec=1; next } insec{print}' CHANGELOG.md)
          {
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "See [CHANGELOG.md](https://github.com/KurtStevenK/cursor-auto-runner/blob/master/CHANGELOG.md) for details."
            fi
            echo ""
            echo "## Downloads & install"
            echo ""
            echo "| Platform | File | Install |"
            echo "|---|---|---|"
            echo "| Windows | \`Cursor.Auto.Runner.Setup.$VERSION.exe\` | Run the installer, or \`choco install cursor-auto-runner\` |"
            echo "| macOS | \`Cursor.Auto.Runner-$VERSION.dmg\` (or \`-arm64.dmg\`, \`.zip\`) | Open the DMG / unzip the app, or \`brew install --cask KurtStevenK/tap/cursor-auto-runner\` |"
            echo "| Linux (Debian/Ubuntu) | [\`.deb\` on Firebase Storage](https://firebasestorage.googleapis.com/v0/b/cursor-auto-runner-linux.firebasestorage.app/o/linux%2F${VERSION}%2Fcursor-auto-runner_${VERSION}_amd64.deb?alt=media) | \`apt-get install cursor-auto-runner\` after [adding the APT repo](https://github.com/KurtStevenK/cursor-auto-runner/blob/master/packaging/apt/README.md) |"
            echo "| Linux (any distro) | [\`AppImage\` on Firebase Storage](https://firebasestorage.googleapis.com/v0/b/cursor-auto-runner-linux.firebasestorage.app/o/linux%2F${VERSION}%2Fcursor-auto-runner-${VERSION}.AppImage?alt=media) | \`chmod +x\` and run |"
            echo "| Linux (Arch) | [\`.pacman\` on Firebase Storage](https://firebasestorage.googleapis.com/v0/b/cursor-auto-runner-linux.firebasestorage.app/o/linux%2F${VERSION}%2Fcursor-auto-runner-${VERSION}.pacman?alt=media) | \`sudo pacman -U\` the downloaded package |"
            if [[ -f virustotal-report.md ]]; then
              echo ""
              cat virustotal-report.md
            fi
          } > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/windows/**
            artifacts/macos/**
          body_path: release-notes.md
          generate_release_notes: true

      - name: Verify publish secrets
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "TAP_TOKEN is required (Homebrew tap and APT repo push). Add it under Settings → Secrets → Actions." >&2
            exit 1
          fi
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "APT_GPG_PRIVATE_KEY is required" >&2
            exit 1
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_X64="artifacts/macos/Cursor.Auto.Runner-${VERSION}.dmg"
          DMG_ARM="artifacts/macos/Cursor.Auto.Runner-${VERSION}-arm64.dmg"
          SHA_X64=$(shasum -a 256 "$DMG_X64" | cut -d' ' -f1)
          SHA_ARM=$(shasum -a 256 "$DMG_ARM" | cut -d' ' -f1)
          mkdir -p Casks
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__SHA_X64__/$SHA_X64/g" -e "s/__SHA_ARM__/$SHA_ARM/g" packaging/homebrew/cursor-auto-runner.rb > Casks/cursor-auto-runner.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/KurtStevenK/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp Casks/cursor-auto-runner.rb tap/Casks/cursor-auto-runner.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cursor-auto-runner.rb
          git diff --cached --quiet || git commit -m "cursor-auto-runner $VERSION"
          git push

      - name: Update APT repository
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="artifacts/linux/cursor-auto-runner_${VERSION}_amd64.deb"
          if [[ ! -f "$DEB" ]]; then
            echo "deb artifact not found: $DEB" >&2
            ls -la artifacts/linux/ || true
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg gzip git-lfs
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/KurtStevenK/apt.git" apt-repo
          cd apt-repo
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          elif git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          git lfs install --local
          git config lfs.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w 0)"
          git lfs track "*.deb"
          POOL="pool/main/c/cursor-auto-runner"
          mkdir -p "$POOL"
          BACKFILL="$POOL/cursor-auto-runner_1.2.43_amd64.deb"
          if [[ ! -f "$BACKFILL" ]]; then
            curl -fL --retry 3 -o "$BACKFILL" \
              "https://github.com/KurtStevenK/cursor-auto-runner/releases/download/v1.2.43/cursor-auto-runner_1.2.43_amd64.deb"
          fi
          bash "$GITHUB_WORKSPACE/packaging/apt/publish.sh" "$(pwd)" "$GITHUB_WORKSPACE/$DEB"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes pool dists gpg.key .nojekyll
          git diff --cached --quiet || git commit -m "cursor-auto-runner $VERSION"
          if ! git push -u origin gh-pages; then
            echo "::warning::APT gh-pages push rejected; rebasing onto origin/gh-pages and retrying once"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push -u origin gh-pages
          fi

  chocolatey:
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: artifacts
      - name: Push to Chocolatey
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          bash packaging/chocolatey/should-push.sh || rc=$?
          if [[ $rc -eq 2 ]]; then
            echo "::notice title=Chocolatey::Skipping push while no approved package version exists (moderation backlog). Run the chocolatey-push workflow after approval."
            exit 0
          fi
          if [[ $rc -ne 0 ]]; then
            exit $rc
          fi
          choco apikey add --key "$CHOCOLATEY_API_KEY" --source https://push.chocolatey.org/
          while IFS= read -r -d '' f; do
            choco push "$f" --source https://push.chocolatey.org/
          done < <(find artifacts -name '*.nupkg' -print0)
