name: CI

# Runs on every PR and on master merges so branch protection can require this check.
# Full multi-platform release builds still run only on version tags (build.yml).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder install-app-deps
      - run: npm run test:stats
      - run: npm run bench:matcher

  firebase-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-landing/package-lock.json
      - run: npm ci --prefix firebase-landing
      - run: npm run build --prefix firebase-landing
